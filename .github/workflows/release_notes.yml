name: Release Notes

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag of release like v15.0.0
        required: true
        type: string
  release:
    types: [released]

permissions:
  contents: read

jobs:
  regen-notes:
    name: Regenerate release notes
    runs-on: ubuntu-latest

    steps:
      - name: Update notes
        run: |
          REPO="${GITHUB_REPOSITORY}"
          NEW_NOTES=$(gh api --method POST -H "Accept: application/vnd.github+json" /repos/$REPO/releases/generate-notes -f tag_name=$RELEASE_TAG \
            | jq -r '.body' \
            | sed -E '/^\* (chore|ci|test|docs|style)/d'
          )
          RELEASE_ID=$(gh api -H "Accept: application/vnd.github+json" /repos/$REPO/releases/tags/$RELEASE_TAG | jq -r '.id')
          gh api --method PATCH -H "Accept: application/vnd.github+json" /repos/$REPO/releases/$RELEASE_ID -f body="$NEW_NOTES"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}